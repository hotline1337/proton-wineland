name: Snapshot-V3

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-slim
    outputs:
      full_desc: ${{ steps.version.outputs.full_desc }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Version
      id: version
      shell: bash
      run: |
        full_desc=$(git describe --long --tags --match 'wineland-*' --match 'cachyos-wineland-*')
        echo "full_desc=${full_desc#cachyos-}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (native, no SLR)
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      BUILD_NAME: proton-${{ needs.version.outputs.full_desc }}-x86_64_v3
    steps:

    - name: Debloat GitHub runner
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: >-
          azure-cli
          google-cloud-cli
          microsoft-edge-stable
          google-chrome-stable
          firefox
          postgresql*
          temurin-*
          *llvm*
          mysql*
          dotnet-sdk-*
        remove_packages_one_command: false
        remove_folders: >-
          /usr/share/swift
          /usr/share/miniconda
          /usr/share/az*
          /usr/local/lib/node_modules
          /usr/local/share/chromium
          /usr/local/share/powershell
          /usr/local/julia
          /usr/local/aws-cli
          /usr/local/aws-sam-cli
          /usr/share/gradle
        testing: false

    - name: Prepare host
      run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: false

    - name: Patch
      run: |
        git submodule update --init --filter=tree:0 --recursive
        # Strip require_tool_appid so the built Proton runs on the host
        # without pressure-vessel / Steam Linux Runtime.
        sed -i '/"require_tool_appid"/d' toolmanifest_x86_64.vdf
        mkdir ./build

    - name: Configure
      working-directory: ./build
      env:
        CFLAGS: -O3 -march=x86-64-v3 -mtune=core-avx2
        RUSTFLAGS: -Copt-level=3 -Ctarget-cpu=x86-64-v3
        USE_LTO: 0
      run: |
        ../configure.sh \
          --build-name=${{ env.BUILD_NAME }} \
          --container-engine=docker \
          --enable-ccache \
          --enable-wow64
        cat Makefile

    - name: Cache identifier
      working-directory: ./build
      id: ccache-id
      run: |
        image=$(make get-steamrt-image | tail -1)
        checksum=$(echo "$image -O3 -march=x86-64-v3 -mtune=core-avx2 --enable-ccache --enable-wow64" | sha1sum | cut -d' ' -f1)
        echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

    - name: Restore cache
      id: ccache-restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ccache-proton-${{ steps.ccache-id.outputs.checksum }}-${{ github.run_id }}
        restore-keys: |
          ccache-proton-${{ steps.ccache-id.outputs.checksum }}

    - name: Make
      working-directory: ./build
      run: make redist

    - name: Save cache
      id: ccache-save
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ~/.ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    - name: Upload artifact (tar.xz)
      uses: actions/upload-artifact@v6
      with:
        name: proton-${{ needs.version.outputs.full_desc }}-x86_64_v3.tar.xz
        path: ./build/proton-${{ needs.version.outputs.full_desc }}-x86_64_v3.tar.xz

    - name: Upload artifact (sha512sum)
      uses: actions/upload-artifact@v6
      with:
        name: proton-${{ needs.version.outputs.full_desc }}-x86_64_v3.sha512sum
        path: ./build/proton-${{ needs.version.outputs.full_desc }}-x86_64_v3.sha512sum
